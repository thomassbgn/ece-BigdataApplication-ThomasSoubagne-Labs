services:
  kafka:
    image: apache/kafka-native:4.1.1
    container_name: wikistreams_kafka
    ports:
      - "9094:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - kafka-spark-net

  pyspark-notebook:
    image: quay.io/jupyter/pyspark-notebook@sha256:80430186e2e97c5e0a9a3c117798d4007bc0a289b8a72cf3a9fc92f044b4c4f1
    container_name: wikistreams_notebook
    user: root
    ports:
      - "8888:8888"
      - "4040:4040"
      - "4041:4041"
    environment:
      - PYTHONPATH=/usr/local/spark/python:/usr/local/spark/python/lib/py4j-0.10.9.9-src.zip
      - NB_UID=${UID:-1000}
      - NB_GID=${GID:-1000}
      - CHOWN_EXTRA=/home/jovyan/work,/home/jovyan/jobs,/home/jovyan/data
      - CHOWN_EXTRA_OPTS=-R
    volumes:
      - ${PROJECT_DIR:-.}/notebooks:/home/jovyan/work
      - ${PROJECT_DIR:-.}/jobs:/home/jovyan/jobs
      - ${PROJECT_DIR:-.}/data:/home/jovyan/data
    networks:
      - kafka-spark-net
    depends_on:
      - kafka

networks:
  kafka-spark-net:
    driver: bridge
